<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arbitrage des désaccords</title>
<style>
:root { --bg:#fafaf9; --panel:#ffffff; --ink:#1c1917; --muted:#57534e; --line:#e7e5e4;
        --enr:#eff6ff; --enr-b:#93c5fd; --dep:#f0fdf4; --dep-b:#86efac; --accent:#1d4ed8; --warn:#b45309; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#1c1917; --panel:#292524; --ink:#f5f5f4; --muted:#a8a29e; --line:#44403c;
          --enr:#172554; --enr-b:#1e40af; --dep:#052e16; --dep-b:#166534; --accent:#93c5fd; --warn:#fbbf24; }
}
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, sans-serif; }
main { max-width: 980px; margin: 0 auto; padding: 16px; }
header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; }
h1 { font-size: 18px; margin: 0; }
.progress { color: var(--muted); }
.card { background: var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; margin-top:12px; }
.oc { border-left:4px solid; padding:6px 10px; margin:6px 0; border-radius:4px; }
.enr { background:var(--enr); border-color:var(--enr-b); }
.dep { background:var(--dep); border-color:var(--dep-b); }
.tf, .desc, .sec { color: var(--muted); font-size: 13px; }
h2 { font-size: 15px; margin: 12px 0 4px; }
.labels { display:grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap:12px; }
.lab { border:1px solid var(--line); border-radius:8px; padding:10px; }
.lab b { display:block; margin-bottom:4px; }
.warn { color: var(--warn); font-size: 13px; }
fieldset { border:1px solid var(--line); border-radius:8px; margin:10px 0; padding:8px 12px; }
legend { color: var(--muted); font-size: 13px; }
label { margin-right: 14px; display:inline-block; }
textarea, input[type=text] { width:100%; background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:6px; font:inherit; }
.nav { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
button { background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:8px 14px; font:inherit; cursor:pointer; }
button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
details { margin-top: 8px; font-size: 13px; }
details pre { white-space: pre-wrap; font: 13px/1.5 system-ui, sans-serif; color: var(--muted); }
.done { color: #16a34a; }
</style>
</head>
<body>
<main>
<header>
  <h1>Arbitrage des désaccords — critères principaux</h1>
  <span class="progress" id="progress"></span>
</header>
<div class="card">
  <label style="width:100%">Arbitre (initiales) <input type="text" id="arbitre"></label>
  <details><summary>Règles (classify/GUIDELINES.md)</summary><pre id="rules"></pre></details>
</div>
<div class="card" id="trial"></div>
<div class="card">
  <h2>Décision</h2>
  <fieldset><legend>Verdict</legend><div id="verdicts"></div></fieldset>
  <fieldset id="typesBox"><legend>Types (si changement)</legend><div id="types"></div></fieldset>
  <fieldset id="gravBox"><legend>Gravité (si changement)</legend><div id="grav"></div></fieldset>
  <label style="width:100%">Note (une phrase : ce qui motive la décision)<textarea id="note" rows="2"></textarea></label>
  <div class="nav">
    <button id="prev">← Précédent</button>
    <button class="primary" id="next">Suivant →</button>
    <button id="export">Exporter adjudication.json</button>
  </div>
</div>
</main>

const RULES = "# Règles d'annotation : critères principaux enregistrés vs déposés\n\nUnité : un essai. On compare les critères principaux de la **version de référence** du registre\n(dernière version soumise au plus tard le mois de début ; sinon la première version) aux\ncritères principaux **déposés avec les résultats**. Les titres des critères secondaires déposés\nservent uniquement à détecter une rétrogradation.\n\nCadre : Zarin et al. (2011), éléments d'un critère : domaine, mesure (instrument), métrique\n(valeur finale, changement depuis l'inclusion, délai jusqu'à l'événement), méthode d'agrégation\n(moyenne, proportion, médiane), délai d'évaluation.\n\n## Verdict (un seul)\n\n- `identique` : mêmes critères, au plus des différences de casse ou de ponctuation, ou un délai\n  réexprimé sans contradiction (« 4 weeks » → « Baseline and 4 weeks », « Up to 36 months » → date de\n  gel des données) ou une fenêtre de tolérance prolongée par la période de suivi (52 semaines de\n  traitement → fin d'étude + 4 semaines).\n- `reformulation` : mêmes critères, formulation différente sans effet sur le contenu\n  (« Proportion » ↔ « Percentage » ↔ « Number of participants » pour un même événement binaire,\n  sigle développé, ordre des mots, simple mention du bras ou de la population d'analyse dans le titre).\n- `precision` : le registre était vague et le dépôt précise un élément sans contredire\n  l'enregistrement : métrique ajoutée là où aucune n'était indiquée (« Change in… », « Number of\n  participants with… », répondeur défini sur l'échelle enregistrée, variation moyenne pour une\n  « réponse » non définie : jamais un changement), critère déposé par période, strate, sous-groupe\n  ou population d'analyse sans autre changement, critère composite déposé en ses composantes\n  enregistrées (PAS et PAD pour « baisse de la PA »).\n- `changement` : au moins un élément contredit l'enregistrement ou un critère principal\n  apparaît ou disparaît (voir les types).\n- `indeterminable` : impossible de juger (pas de critère enregistré, texte inexploitable).\n\n## Types (liste, seulement si verdict = `changement`)\n\n- `supprime` : un critère principal enregistré n'est plus critère principal déposé et n'apparaît pas en secondaire.\n  Toujours vérifier les titres secondaires déposés avant de coder `supprime`.\n- `retrograde` : un critère principal enregistré apparaît dans les secondaires déposés. Si un nouveau\n  critère principal prend sa place : `retrograde` + `ajoute` (pas `remplace`).\n- `ajoute` : un nouveau critère principal, absent de l'enregistrement, est déposé\n  (les critères de tolérance ajoutés comptent aussi).\n- `remplace` : un critère principal enregistré, absent des secondaires déposés, est remplacé par un\n  critère d'un autre domaine.\n- `delai` : délai d'évaluation différent (12 mois → 6 mois). Pas une simple précision.\n- `metrique` : métrique ou agrégation différente (moyenne → proportion, délai jusqu'à\n  l'événement → pourcentage, valeur finale → changement depuis l'inclusion quand l'une des deux était explicite).\n- `mesure` : instrument ou définition différente (échelle différente, seuil différent,\n  composite modifié).\n\n## Gravité (si `changement`)\n\n- `majeur` : `supprime` (y compris d'un critère de tolérance), `remplace`, `retrograde`, ou `ajoute`\n  d'un nouveau critère d'efficacité.\n- `mineur` : seulement `delai`, `metrique`, `mesure`, ou `ajoute` de tout autre critère (tolérance,\n  pharmacocinétique, seuil supplémentaire sur une échelle enregistrée, même critère redéposé sous une\n  autre étiquette).\n- Cas particulier : un critère enregistré déposé en plus à un autre point temporel ou avec une\n  autre agrégation (semaine 52 en plus de la semaine 24, médiane en plus de la moyenne) →\n  types `ajoute` + `delai` (ou `metrique`), gravité `mineur`. De même pour le même critère déposé en\n  plus pour une autre agence (FDA, PMDA) sur une autre fenêtre ou avec une autre règle de traitement\n  de secours : `ajoute` + `delai`, `mineur`. Le retrait d'un point temporel\n  ou d'une agrégation d'un critère conservé → `delai` ou `metrique`, `mineur`.\n\n## Principes\n\n- Dans le doute entre `precision` et `changement`, choisir `precision` et l'expliquer dans\n  la note : on préfère sous-estimer qu'accuser à tort.\n- On ne juge pas si le changement est justifié : ce n'est pas observable ici.\n- Note : une phrase, en français, citant l'élément qui motive le verdict.\n\n\n";

    state.decisions[t.nct] = {
      nct: t.nct, verdict: v,
      types: chg ? [...document.querySelectorAll("#types input:checked")].map(c => c.value) : [],
      gravite: chg ? ((document.querySelector("input[name=gravite]:checked") || {}).value || null) : null,
      note: document.getElementById("note").value,
      arbitre: state.arbitre,
    };
  }
  save();
}
document.getElementById("verdicts").addEventListener("change", toggle);
document.getElementById("next").onclick = () => { store(); if (state.i < DATA.length - 1) state.i++; save(); render(); };
document.getElementById("prev").onclick = () => { store(); if (state.i > 0) state.i--; save(); render(); };
document.getElementById("export").onclick = () => {
  store();
  const out = { decisions: DATA.map(t => state.decisions[t.nct]).filter(Boolean) };
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 1)], { type: "application/json" }));
  a.download = "adjudication.json"; a.click();
};
render();
</script>
</body>
</html>
